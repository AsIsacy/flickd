name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build & package macOS Universal Release
        run: make package VERSION="${{ steps.ver.outputs.version }}"

      - name: Verify binary architectures & CLI
        run: |
          VER="${{ steps.ver.outputs.version }}"
          lipo -info "build/Flickd-v${VER}/Flickd.app/Contents/MacOS/flickd"
          "./build/Flickd-v${VER}/Flickd.app/Contents/MacOS/flickd" --help

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.version }}"
          ZIP="build/Flickd-v${VER}-macos-universal.zip"
          SUMS="build/SHA256SUMS.txt"
          NOTES=$(cat <<EOF
          ## flickd ${TAG} (macOS Universal: Apple Silicon + Intel)

          ### Quick Install
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          \`\`\`

          Or download \`Flickd-v${VER}-macos-universal.zip\`, unzip it, and run \`./install.sh\` inside the folder.

          > **Note (Unsigned / Ad-hoc Signed Build):** Because this open-source build is ad-hoc signed without an Apple Developer ID, if you download the zip via a browser macOS may quarantine it. Running \`./install.sh\` automatically clears the quarantine attribute (\`xattr -dr com.apple.quarantine\`).

          ### First-Time Permission
          Open **System Settings → Privacy & Security → Accessibility**, add \`~/Applications/Flickd.app\`, and toggle it on. \`flickd\` detects the grant within 3 seconds automatically.

          ### Checksums
          \`\`\`
          $(cat "${SUMS}")
          \`\`\`
          EOF
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" "${SUMS}" --clobber
          else
            gh release create "${TAG}" "${ZIP}" "${SUMS}" \
              --title "flickd ${TAG}" \
              --notes "${NOTES}" \
              --generate-notes
          fi
